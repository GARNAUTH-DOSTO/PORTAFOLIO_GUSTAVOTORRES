site_name: Gustavo Torres · Auxiliar Administrativo
site_description: Portafolio de habilidades y experiencia como auxiliar administrativo y operativo
site_author: Gustavo Torres Garnauth

theme:
  name: material
  language: es
  palette:
    scheme: default
    primary: white
    accent: teal
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/custom.css

nav:
  - Inicio: index.md
  - Experiencia: experiencia.md
  - Habilidades: habilidades.md
  - Proyectos:
    - proyectos/index.md
    - Formulario digital de registro: proyectos/formulario-registro.md
    - Control de inventario: proyectos/inventario-insumos.md
    - Alertas por correo: proyectos/alertas-correo.md
  - Formación y contacto: formacion-contacto.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
